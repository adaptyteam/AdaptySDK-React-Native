name: Kids Mode (iOS)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify mode'
        required: false
        type: choice
        options:
          - 'on'
          - 'off'
          - 'both'
        default: 'on'
  schedule:
    - cron: '0 9 * * 1'   # weekly Mon 09:00 UTC — full `both` (negative + positive control)
  pull_request:
    branches: [ master, dev ]
    paths:
      - 'ios/adapty_kids_mode.rb'
      - 'react-native-adapty-sdk.podspec'
      - 'examples/AdaptyDevtools/ios/Podfile'
      # SwiftPM path
      - 'Package.swift'
      - 'scripts/kids-mode.cjs'
      - 'examples/AdaptyDevtoolsSpm/package.json'
      - 'scripts/verify-kids-mode-ios.sh'
      - '.github/workflows/kids-mode-ios.yml'

concurrency:
  group: kids-mode-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-kids-mode-ios:
    runs-on: macos-26
    name: Verify Kids Mode (iOS, ${{ matrix.target }})
    timeout-minutes: 90   # cold build; a `both` run compiles the app twice (off + on)

    # CocoaPods never reads Package.swift and SwiftPM never reads the podspec, so Kids Mode has
    # a separate toggle on each path and each needs its own end-to-end proof.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: pods
            example: examples/AdaptyDevtools
          - target: spm
            example: examples/AdaptyDevtoolsSpm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.4'

      - name: Cache node_modules
        uses: actions/cache@v5
        id: cache-node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Cache example app node_modules
        uses: actions/cache@v5
        id: cache-example-node-modules
        with:
          path: ${{ matrix.example }}/node_modules
          key: example-kids-node-modules-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles(format('{0}/yarn.lock', matrix.example)) }}
          restore-keys: |
            example-kids-node-modules-${{ matrix.target }}-${{ runner.os }}-

      - name: Install example app dependencies
        if: steps.cache-example-node-modules.outputs.cache-hit != 'true'
        run: |
          cd ${{ matrix.example }}
          yarn install --frozen-lockfile

      # examples/AdaptyDevtoolsSpm/src is a mirror of examples/AdaptyDevtools/src and is not
      # committed. The app's postinstall syncs it, but the install step above is skipped on a
      # node_modules cache hit — so do it explicitly.
      - name: Sync UI sources from AdaptyDevtools
        if: matrix.target == 'spm'
        run: |
          cd examples/AdaptyDevtoolsSpm
          yarn sync-src

      # For spm this also re-enables Kids Mode: the pack it installs carries a pristine
      # Package.swift, so the app's update-sdk-full chains the toggle back on.
      - name: Build package and install
        run: |
          cd ${{ matrix.example }}
          yarn update-sdk-full

      - name: Cache CocoaPods
        if: matrix.target == 'pods'
        uses: actions/cache@v5
        with:
          path: |
            examples/AdaptyDevtools/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-kids-${{ runner.os }}-${{ hashFiles('examples/AdaptyDevtools/ios/Podfile.lock') }}
          restore-keys: |
            pods-kids-${{ runner.os }}-

      # React Native's prebuilt xcframeworks, downloaded once per RN version.
      - name: Cache SwiftPM artifacts
        if: matrix.target == 'spm'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ReactNative/spm-artifacts
          key: spm-artifacts-kids-${{ runner.os }}-${{ hashFiles('examples/AdaptyDevtoolsSpm/package.json') }}
          restore-keys: |
            spm-artifacts-kids-${{ runner.os }}-

      - name: Cache SPM checkouts
        uses: actions/cache@v5
        with:
          path: .spm-kids-mode
          key: kids-mode-spm-${{ matrix.target }}-${{ runner.os }}-${{ hashFiles('Package.swift', 'react-native-adapty-sdk.podspec') }}
          restore-keys: |
            kids-mode-spm-${{ matrix.target }}-${{ runner.os }}-

      - name: Determine verify mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=both" >> "$GITHUB_OUTPUT"   # weekly: negative + positive control
          else
            echo "mode=${INPUT_MODE:-on}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Kids Mode (on -> AdSupport/IDFA absent; both -> +negative control)
        env:
          VERIFY_MODE: ${{ steps.mode.outputs.mode }}
        run: bash scripts/verify-kids-mode-ios.sh "$VERIFY_MODE" "${{ matrix.target }}"
