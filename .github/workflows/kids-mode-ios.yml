name: Kids Mode (iOS)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify mode'
        required: false
        type: choice
        options:
          - 'on'
          - 'off'
          - 'both'
        default: 'on'
  schedule:
    - cron: '0 9 * * 1'   # weekly Mon 09:00 UTC — full `both` (negative + positive control)
  pull_request:
    branches: [ master, dev ]
    paths:
      - 'ios/adapty_kids_mode.rb'
      - 'ios/adapty_podfile.rb'
      - 'react-native-adapty-sdk.podspec'
      - 'examples/AdaptyDevtools/ios/Podfile'
      - 'Package.swift'
      - 'scripts/kids-mode.cjs'
      - 'examples/AdaptyDevtoolsSpm/package.json'
      - 'scripts/verify-kids-mode-ios.sh'
      - '.github/workflows/kids-mode-ios.yml'

concurrency:
  group: kids-mode-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-kids-mode-ios:
    runs-on: macos-26
    name: Verify Kids Mode (iOS, ${{ matrix.name }})
    timeout-minutes: 60   # cold build; a `both` run compiles the app twice (off + on)
    env:
      DEVTOOLS_DISABLE_SPM: ${{ matrix.disable-spm }}

    # Same integrations as ios-builds.yml, each with its own Kids Mode toggle: CocoaPods never
    # reads Package.swift and SwiftPM never reads the podspec, and the legacy CocoaPods pods get
    # `-DKidsMode` from the Podfile helper instead of the package trait. `cache-id` keeps their
    # caches apart; the legacy pods use their own, like in ios-builds.yml.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pure SPM
            target: spm
            example: examples/AdaptyDevtoolsSpm
            cache-id: spm
            disable-spm: ''
          - name: CocoaPods + spm_dependency
            target: pods
            example: examples/AdaptyDevtools
            cache-id: pods
            disable-spm: ''
          - name: Pure CocoaPods
            target: pods
            example: examples/AdaptyDevtools
            cache-id: legacy-pods
            disable-spm: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.4'

      - name: Cache node_modules
        uses: actions/cache@v5
        id: cache-node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Cache example app node_modules
        uses: actions/cache@v5
        id: cache-example-node-modules
        with:
          path: ${{ matrix.example }}/node_modules
          key: example-kids-node-modules-${{ matrix.cache-id }}-${{ runner.os }}-${{ hashFiles(format('{0}/yarn.lock', matrix.example)) }}
          restore-keys: |
            example-kids-node-modules-${{ matrix.cache-id }}-${{ runner.os }}-

      - name: Install example app dependencies
        if: steps.cache-example-node-modules.outputs.cache-hit != 'true'
        run: |
          cd ${{ matrix.example }}
          yarn install --frozen-lockfile

      # examples/AdaptyDevtoolsSpm/src is a mirror of examples/AdaptyDevtools/src and is not
      # committed. The app's postinstall syncs it, but the install step above is skipped on a
      # node_modules cache hit — so do it explicitly.
      - name: Sync UI sources from AdaptyDevtools
        if: matrix.target == 'spm'
        run: |
          cd examples/AdaptyDevtoolsSpm
          yarn sync-src

      # For spm this also re-enables Kids Mode: the pack it installs carries a pristine
      # Package.swift, so the app's update-sdk-full chains the toggle back on.
      - name: Build package and install
        run: |
          cd ${{ matrix.example }}
          yarn update-sdk-full

      - name: Cache CocoaPods
        if: matrix.target == 'pods'
        uses: actions/cache@v5
        with:
          path: |
            examples/AdaptyDevtools/ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          # The podspec pins the native SDK (SPM version or pods version), so a bump changes the key;
          # the committed Podfile.lock alone is the SPM-mode one and never changes for the pods.
          key: ${{ matrix.cache-id == 'legacy-pods' && 'legacy-pods-kids' || 'pods-kids' }}-${{ runner.os }}-${{ hashFiles('examples/AdaptyDevtools/ios/Podfile.lock', 'examples/AdaptyDevtools/node_modules/react-native-adapty/react-native-adapty-sdk.podspec', 'examples/AdaptyDevtools/node_modules/react-native-adapty/ios/**/*') }}
          restore-keys: |
            ${{ matrix.cache-id == 'legacy-pods' && 'legacy-pods-kids' || 'pods-kids' }}-${{ runner.os }}-

      # React Native's prebuilt xcframeworks, downloaded once per RN version.
      - name: Cache SwiftPM artifacts
        if: matrix.target == 'spm'
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ReactNative/spm-artifacts
          key: spm-artifacts-kids-${{ runner.os }}-${{ hashFiles('examples/AdaptyDevtoolsSpm/package.json') }}
          restore-keys: |
            spm-artifacts-kids-${{ runner.os }}-

      - name: Cache SPM checkouts
        uses: actions/cache@v5
        with:
          path: .spm-kids-mode
          key: kids-mode-spm-${{ matrix.cache-id }}-${{ runner.os }}-${{ hashFiles('Package.swift', 'react-native-adapty-sdk.podspec') }}
          restore-keys: |
            kids-mode-spm-${{ matrix.cache-id }}-${{ runner.os }}-

      - name: Determine verify mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "mode=both" >> "$GITHUB_OUTPUT"   # weekly: negative + positive control
          else
            echo "mode=${INPUT_MODE:-on}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Kids Mode (on -> AdSupport/IDFA absent; both -> +negative control)
        env:
          VERIFY_MODE: ${{ steps.mode.outputs.mode }}
        run: bash scripts/verify-kids-mode-ios.sh "$VERIFY_MODE" "${{ matrix.target }}"

      # The script leaves the example installed with Kids Mode off, still in pods mode. Catches the
      # pods mode not engaging (no Adapty pods in the lock) or the Adapty pods resolving from trunk.
      - name: Check the Adapty pods came from the spec repo
        if: matrix.disable-spm == '1'
        run: |
          cd examples/AdaptyDevtools/ios
          ruby -ryaml -e 'pods = YAML.load_file("Podfile.lock").dig("SPEC REPOS", ARGV[0]) || []
            exit((%w[Adapty AdaptyUI AdaptyPlugin] - pods).empty?)' https://github.com/adaptyteam/AdaptySDK-CocoaPods-Specs.git \
            || { echo "FATAL: the Adapty pods did not resolve from AdaptySDK-CocoaPods-Specs." >&2; exit 1; }
